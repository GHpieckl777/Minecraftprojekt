<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marineford – Team-Dashboard</title>

<!-- Schriften (optional, braucht Internet). Ohne Internet greifen die System-Schriften als Fallback. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
/* =====================================================
   FARBEN & SCHRIFTEN – hier kannst du alles anpassen
   ===================================================== */
:root {
  --bg:        #0d0f12;   /* Seitenhintergrund */
  --surface:   #151a1f;   /* Karten */
  --surface-2: #1c232a;   /* Eingabefelder, Zeilen */
  --line:      #27303a;   /* Rahmen */
  --text:      #e7eef5;   /* Haupttext */
  --muted:     #8a98a6;   /* Nebentext */
  --accent:    #2bff9a;   /* Smaragdgrün (Hauptakzent) */
  --accent-2:  #25d6f5;   /* Cyan (zweiter Akzent) */
  --danger:    #ff5d73;   /* Löschen / Fehler */
  --radius:    14px;
  --font-ui:   "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  background: var(--bg);
  /* dezentes Blockraster im Hintergrund, wie Minecraft-Chunks */
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px;
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-ui);
  line-height: 1.5;
}
body::before { /* dunkelt das Raster zum Rand hin ab */
  content: ""; position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(ellipse at 50% 0%, rgba(13,15,18,.55), var(--bg) 85%);
}

/* ---------- Navigation ---------- */
nav {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  padding: 12px clamp(14px, 4vw, 32px);
  background: rgba(13,15,18,.88); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
nav .logo { font-weight: 700; font-size: 1.15rem; color: var(--accent); margin-right: auto; white-space: nowrap; }
nav a {
  color: var(--muted); text-decoration: none; padding: 6px 12px;
  border-radius: 8px; white-space: nowrap; transition: color .15s, background .15s;
}
nav a:hover { color: var(--text); background: var(--surface-2); }

/* ---------- Layout ---------- */
main { max-width: 1180px; margin: 0 auto; padding: 24px clamp(14px, 4vw, 32px) 60px; display: grid; gap: 20px; }
.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.card h2 { font-size: 1.15rem; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.card h2 small { color: var(--muted); font-weight: 400; font-size: .85rem; margin-left: auto; }

/* ---------- Buttons & Eingaben ---------- */
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer; border: 1px solid var(--line); background: var(--surface-2);
  padding: 8px 14px; border-radius: 9px; transition: border-color .15s, transform .08s, background .15s;
}
button:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: #04140c; border-color: var(--accent); font-weight: 700; }
button.primary:hover { background: #5dffb4; }
button.cyan { border-color: var(--accent-2); color: var(--accent-2); }
button.danger:hover { border-color: var(--danger); color: var(--danger); }
button.icon { padding: 4px 9px; }
input, select {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 12px; min-width: 0;
}
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > input { flex: 1 1 120px; }
.empty { color: var(--muted); padding: 14px 0; }

/* ---------- Hero: Projektfortschritt als XP-Leiste ---------- */
.hero { border-color: rgba(43,255,154,.35); box-shadow: 0 0 40px -18px var(--accent); }
.hero .kicker { color: var(--muted); }
.hero h1 { font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1.1; margin: 4px 0 6px; }
.hero p { color: var(--muted); max-width: 60ch; }
.xp { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin: 22px 0 12px; }
.xp i { height: 22px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 2px; transition: background .3s, box-shadow .3s; }
.xp i.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px -2px var(--accent); }
.xp i.on:nth-child(n+14) { background: var(--accent-2); border-color: var(--accent-2); box-shadow: 0 0 10px -2px var(--accent-2); }
.hero-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.percent { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 600; color: var(--accent); margin-right: auto; }

/* ---------- Aufgaben ---------- */
.list { list-style: none; padding: 0; display: grid; gap: 8px; margin-top: 14px; }
.task { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.task input[type=checkbox] { accent-color: var(--accent); width: 20px; height: 20px; flex: none; }
.task span { flex: 1; word-break: break-word; }
.task.done span { color: var(--muted); text-decoration: line-through; }

/* ---------- Koordinaten ---------- */
.coord { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.coord b { display: block; }
.coord .xyz { font-family: var(--font-mono); font-size: .9rem; color: var(--accent-2); }
.coord .dim { color: var(--muted); font-size: .8rem; }
.coord .btns { display: flex; gap: 6px; }
.add-coord { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin-top: 14px; }
.add-coord .wide { grid-column: 1 / -1; }

/* ---------- Zeiterfassung ---------- */
.member { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.member.active { border-color: var(--accent); box-shadow: 0 0 18px -8px var(--accent); }
.member .time { font-family: var(--font-mono); font-size: 1.25rem; }
.member .state { color: var(--muted); font-size: .85rem; }
.member.active .state { color: var(--accent); }

/* ---------- Minispiele ---------- */
.ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 280px; margin: 10px 0; }
.ttt button { aspect-ratio: 1; font-size: 2rem; font-weight: 700; padding: 0; }
.ttt button.x { color: var(--accent); }
.ttt button.o { color: var(--accent-2); }
.ttt button.win { background: rgba(43,255,154,.15); border-color: var(--accent); }
.clicker-btn { width: 100%; padding: 22px; font-size: 1.2rem; border-color: var(--accent-2); }
.big { font-family: var(--font-mono); font-size: 2rem; color: var(--accent-2); }
.status { color: var(--muted); min-height: 1.5em; }

/* ---------- 3D-Bauplan-Viewer ---------- */
[hidden] { display: none !important; }
.drop { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, color .15s; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--text); }
.drop input { display: none; }
.bp-info { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 14px 0; font-family: var(--font-mono); font-size: .85rem; color: var(--muted); }
.bp-info b { color: var(--accent-2); font-weight: 600; }
.viewer { position: relative; height: clamp(340px, 60vh, 620px); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
.viewer:fullscreen { height: 100%; border-radius: 0; }
.viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.viewer canvas:active { cursor: grabbing; }
.viewer .hint { position: absolute; left: 12px; bottom: 10px; font-size: .8rem; color: var(--muted); pointer-events: none; }
.viewer .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); pointer-events: none; }
.bp-controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 12px; }
.bp-controls label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.bp-controls input[type=range] { accent-color: var(--accent); padding: 0; }
.bp-controls input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; }
details.mat { margin-top: 14px; }
details.mat summary { cursor: pointer; color: var(--accent-2); }
.mat-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 4px 20px; margin: 12px 0; max-height: 320px; overflow-y: auto; font-size: .9rem; }
.mat-list div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.mat-list span:last-child { font-family: var(--font-mono); color: var(--muted); text-align: right; }

/* ---------- Toast (kleine Meldung unten) ---------- */
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0;
  background: var(--accent); color: #04140c; font-weight: 700; padding: 10px 18px; border-radius: 10px;
  transition: .25s; pointer-events: none; z-index: 20;
}
#toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<body>

<nav>
  <span class="logo">⛏ Marineford</span>
  <a href="#projekt">Projekt</a>
  <a href="#bauplan">Bauplan</a>
  <a href="#aufgaben">Aufgaben</a>
  <a href="#koordinaten">Koordinaten</a>
  <a href="#zeit">Zeiterfassung</a>
  <a href="#spiele">Minispiele</a>
</nav>

<main>

  <!-- ===== PROJEKT / FORTSCHRITT ===== -->
  <section class="card hero" id="projekt">
    <div class="kicker">Aktuelles Großprojekt</div>
    <h1 id="projName" contenteditable="true" spellcheck="false" title="Zum Umbenennen anklicken"></h1>
    <p id="projDesc" contenteditable="true" spellcheck="false" title="Zum Ändern anklicken"></p>
    <div class="xp" id="xp" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="hero-foot">
      <span class="percent" id="percent">0 %</span>
      <button id="pMinus">−5 %</button>
      <button id="pPlus" class="primary">+5 %</button>
      <button id="pAuto" class="cyan" title="Prozent aus erledigten Aufgaben berechnen">Aus Aufgaben berechnen</button>
    </div>
  </section>

  <div class="grid">

    <!-- ===== AUFGABEN ===== -->
    <section class="card" id="aufgaben">
      <h2>Aufgaben <small id="taskCount"></small></h2>
      <form class="row" id="taskForm">
        <input id="taskInput" placeholder="Neue Aufgabe, z. B. Hafenmauer bauen" maxlength="120" required>
        <button class="primary">Hinzufügen</button>
      </form>
      <ul class="list" id="taskList"></ul>
    </section>

    <!-- ===== KOORDINATEN ===== -->
    <section class="card" id="koordinaten">
      <h2>Koordinaten <small>Overworld, Nether, End</small></h2>
      <ul class="list" id="coordList"></ul>
      <form class="add-coord" id="coordForm">
        <input class="wide" id="cName" placeholder="Name, z. B. Eisenfarm" maxlength="40" required>
        <input id="cX" type="number" placeholder="X" required>
        <input id="cY" type="number" placeholder="Y" required>
        <input id="cZ" type="number" placeholder="Z" required>
        <select id="cDim">
          <option value="overworld">Overworld</option>
          <option value="nether">Nether</option>
          <option value="end">End</option>
        </select>
        <button class="primary">Speichern</button>
      </form>
    </section>

    <!-- ===== ZEITERFASSUNG ===== -->
    <section class="card" id="zeit">
      <h2>Zeiterfassung <small>Stempeluhr fürs Team</small></h2>
      <ul class="list" id="teamList"></ul>
      <form class="row" id="memberForm" style="margin-top:14px">
        <input id="memberInput" placeholder="Neues Teammitglied" maxlength="24" required>
        <button>Hinzufügen</button>
      </form>
    </section>

    <!-- ===== MINISPIELE ===== -->
    <section class="card" id="spiele">
      <h2>Minispiele <small>Pause machen</small></h2>

      <b>Diamanten abbauen</b>
      <div class="big" id="diamonds">0 💎</div>
      <button class="clicker-btn" id="mine">⛏ Abbauen (+<span id="power">1</span>)</button>
      <div class="row" style="margin:10px 0 22px; align-items:center">
        <button id="upgrade" class="cyan">Spitzhacke verbessern</button>
        <span class="status" id="upgradeInfo"></span>
      </div>

      <b>Tic-Tac-Toe</b> <span class="status" id="tttScore"></span>
      <div class="ttt" id="ttt"></div>
      <div class="row" style="align-items:center">
        <span class="status" id="tttStatus"></span>
        <button id="tttReset" style="margin-left:auto">Neue Runde</button>
      </div>
    </section>

  </div>
</main>

<div id="toast"></div>

<script>
/* =====================================================
   EINSTELLUNGEN – Texte & Startwerte hier ändern
   ===================================================== */
const CONFIG = {
  storageKey: "marineford-dashboard-v1",        // Neuer Name = frischer Speicherstand
  projectName: "Großprojekt: Marineford",
  projectDesc: "Die Marine-Festung mit Hafen, Plaza und Hinrichtungsplattform.",
  team: ["Meister"],                            // Startmitglieder der Stempeluhr
  tasks: ["Fundament abstecken", "Hafenbecken ausheben", "Hauptmauer bauen"],
  coords: [
    { name: "Mitte der Base", x: 0,   y: 64, z: 0,   dim: "overworld" },
    { name: "Farmen",         x: 120, y: 64, z: -40, dim: "overworld" },
    { name: "Nether-Portal",  x: 15,  y: 70, z: 8,   dim: "nether"    }
  ]
};

/* =====================================================
   STATE & SPEICHERN (localStorage = bleibt im Browser)
   ===================================================== */
const uid = () => Math.random().toString(36).slice(2, 9);

const defaults = () => ({
  project: { name: CONFIG.projectName, desc: CONFIG.projectDesc, progress: 0 },
  tasks:  CONFIG.tasks.map(t => ({ id: uid(), text: t, done: false })),
  coords: CONFIG.coords.map(c => ({ id: uid(), ...c })),
  team:   CONFIG.team.map(n => ({ id: uid(), name: n, total: 0, since: null })), // total in ms
  game:   { diamonds: 0, power: 1, wins: 0, losses: 0, draws: 0 }
});

let state;
try { state = JSON.parse(localStorage.getItem(CONFIG.storageKey)) || defaults(); }
catch { state = defaults(); }

function save() {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch {}
}

/* ---------- Hilfsfunktionen ---------- */
const $ = id => document.getElementById(id);

/** Kleiner DOM-Helfer: h("div", {class:"x"}, "Text", kind, ...) – Text wird sicher eingefügt */
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(k => e.append(k));
  return e;
}

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* =====================================================
   PROJEKT / FORTSCHRITT
   ===================================================== */
function renderProject() {
  const p = state.project;
  $("projName").textContent = p.name;
  $("projDesc").textContent = p.desc;
  $("percent").textContent = p.progress + " %";
  const xp = $("xp");
  xp.setAttribute("aria-valuenow", p.progress);
  if (!xp.children.length) for (let i = 0; i < 20; i++) xp.append(h("i"));
  const filled = Math.round(p.progress / 5); // 20 Segmente = je 5 %
  [...xp.children].forEach((seg, i) => seg.classList.toggle("on", i < filled));
}
const setProgress = v => { state.project.progress = Math.max(0, Math.min(100, v)); save(); renderProject(); };

$("pPlus").onclick  = () => setProgress(state.project.progress + 5);
$("pMinus").onclick = () => setProgress(state.project.progress - 5);
$("pAuto").onclick  = () => {
  if (!state.tasks.length) return toast("Noch keine Aufgaben vorhanden");
  setProgress(Math.round(state.tasks.filter(t => t.done).length / state.tasks.length * 100));
};
// Name & Beschreibung direkt im Text bearbeiten
$("projName").addEventListener("blur", e => { state.project.name = e.target.textContent.trim() || CONFIG.projectName; save(); });
$("projDesc").addEventListener("blur", e => { state.project.desc = e.target.textContent.trim(); save(); });

/* =====================================================
   AUFGABEN
   ===================================================== */
function renderTasks() {
  const list = $("taskList"); list.replaceChildren();
  const done = state.tasks.filter(t => t.done).length;
  $("taskCount").textContent = `${done} / ${state.tasks.length} erledigt`;
  if (!state.tasks.length) list.append(h("li", { class: "empty" }, "Noch keine Aufgaben. Trag oben die erste ein."));
  state.tasks.forEach(t => list.append(
    h("li", { class: "task" + (t.done ? " done" : "") },
      h("input", { type: "checkbox", checked: t.done, "aria-label": "Erledigt", onchange: () => { t.done = !t.done; save(); renderTasks(); } }),
      h("span", {}, t.text),
      h("button", { class: "icon danger", "aria-label": "Aufgabe löschen", onclick: () => { state.tasks = state.tasks.filter(x => x.id !== t.id); save(); renderTasks(); } }, "✕")
    )
  ));
}
$("taskForm").onsubmit = e => {
  e.preventDefault();
  const text = $("taskInput").value.trim(); if (!text) return;
  state.tasks.unshift({ id: uid(), text, done: false });
  $("taskInput").value = ""; save(); renderTasks();
};

/* =====================================================
   KOORDINATEN
   ===================================================== */
const DIM_LABEL = { overworld: "Overworld", nether: "Nether", end: "End" };
const DIM_ID = { overworld: "minecraft:overworld", nether: "minecraft:the_nether", end: "minecraft:the_end" };

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { // Fallback, falls die Datei lokal geöffnet wird und der Browser Clipboard blockt
    const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = text;
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("Kopiert: " + text);
}

function renderCoords() {
  const list = $("coordList"); list.replaceChildren();
  if (!state.coords.length) list.append(h("li", { class: "empty" }, "Noch keine Spots gespeichert."));
  state.coords.forEach(c => list.append(
    h("li", { class: "coord" },
      h("div", {}, h("b", {}, c.name), h("span", { class: "xyz" }, `${c.x} ${c.y} ${c.z}`), " ", h("span", { class: "dim" }, DIM_LABEL[c.dim])),
      h("div", { class: "btns" },
        // Kopiert nur die Zahlen (z. B. für F3-Vergleich oder Chat)
        h("button", { class: "icon", title: "Nur Koordinaten kopieren", onclick: () => copyText(`${c.x} ${c.y} ${c.z}`) }, "XYZ"),
        // Kopiert einen fertigen Teleport-Befehl (braucht Operator-Rechte auf dem Server)
        h("button", { class: "icon cyan", title: "Teleport-Befehl kopieren", onclick: () => copyText(`/execute in ${DIM_ID[c.dim]} run tp @s ${c.x} ${c.y} ${c.z}`) }, "/tp"),
        h("button", { class: "icon danger", "aria-label": "Spot löschen", onclick: () => { state.coords = state.coords.filter(x => x.id !== c.id); save(); renderCoords(); } }, "✕")
      )
    )
  ));
}
$("coordForm").onsubmit = e => {
  e.preventDefault();
  state.coords.push({
    id: uid(), name: $("cName").value.trim(),
    x: +$("cX").value, y: +$("cY").value, z: +$("cZ").value, dim: $("cDim").value
  });
  e.target.reset(); save(); renderCoords();
};

/* =====================================================
   ZEITERFASSUNG
   ===================================================== */
const fmt = ms => {
  const s = Math.floor(ms / 1000);
  return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, "0")).join(":");
};
const elapsed = m => m.total + (m.since ? Date.now() - m.since : 0);

function renderTeam() {
  const list = $("teamList"); list.replaceChildren();
  state.team.forEach(m => list.append(
    h("li", { class: "member" + (m.since ? " active" : ""), "data-id": m.id },
      h("div", {}, h("b", {}, m.name), h("div", { class: "state" }, m.since ? "Eingestempelt" : "Nicht eingestempelt")),
      h("div", { class: "time", "data-time": m.id }, fmt(elapsed(m))),
      h("div", { class: "row" },
        h("button", {
          class: m.since ? "danger" : "primary",
          onclick: () => {
            if (m.since) { m.total += Date.now() - m.since; m.since = null; }
            else m.since = Date.now();
            save(); renderTeam();
          }
        }, m.since ? "Ausstempeln" : "Einstempeln"),
        h("button", { class: "icon danger", title: "Mitglied entfernen", "aria-label": "Mitglied entfernen",
          onclick: () => { if (confirm(`${m.name} wirklich entfernen?`)) { state.team = state.team.filter(x => x.id !== m.id); save(); renderTeam(); } } }, "✕")
      )
    )
  ));
}
$("memberForm").onsubmit = e => {
  e.preventDefault();
  state.team.push({ id: uid(), name: $("memberInput").value.trim(), total: 0, since: null });
  e.target.reset(); save(); renderTeam();
};
// Läuft die Uhr, wird nur die Zeitanzeige jede Sekunde aktualisiert
setInterval(() => {
  state.team.filter(m => m.since).forEach(m => {
    const el = document.querySelector(`[data-time="${m.id}"]`);
    if (el) el.textContent = fmt(elapsed(m));
  });
}, 1000);

/* =====================================================
   MINISPIEL 1: DIAMANTEN-KLICKER
   ===================================================== */
const upgradeCost = () => state.game.power * 25;
function renderClicker() {
  $("diamonds").textContent = state.game.diamonds + " 💎";
  $("power").textContent = state.game.power;
  $("upgrade").disabled = state.game.diamonds < upgradeCost();
  $("upgradeInfo").textContent = `Kostet ${upgradeCost()} 💎`;
}
$("mine").onclick = () => { state.game.diamonds += state.game.power; save(); renderClicker(); };
$("upgrade").onclick = () => {
  if (state.game.diamonds < upgradeCost()) return;
  state.game.diamonds -= upgradeCost(); state.game.power++; save(); renderClicker();
};

/* =====================================================
   MINISPIEL 2: TIC-TAC-TOE (du = X, Computer = O)
   ===================================================== */
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board, over;

const winnerOf = b => {
  for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { who: b[l[0]], line: l };
  return b.every(Boolean) ? { who: "draw", line: [] } : null;
};
// Einfache KI: 1. selbst gewinnen, 2. Gegner blocken, 3. Mitte, 4. zufällig
function aiMove() {
  const free = board.map((v, i) => v ? null : i).filter(i => i !== null);
  for (const sym of ["O", "X"]) for (const i of free) {
    const t = [...board]; t[i] = sym; if (winnerOf(t)?.who === sym) return i;
  }
  return board[4] ? free[Math.floor(Math.random() * free.length)] : 4;
}
function renderTTT(line = []) {
  $("ttt").replaceChildren(...board.map((v, i) =>
    h("button", { class: (v ? v.toLowerCase() : "") + (line.includes(i) ? " win" : ""), disabled: !!v || over, "aria-label": `Feld ${i + 1}`, onclick: () => play(i) }, v || "")
  ));
  const g = state.game;
  $("tttScore").textContent = `Siege ${g.wins} · Niederlagen ${g.losses} · Unentschieden ${g.draws}`;
}
function finish(res) {
  over = true; const g = state.game;
  if (res.who === "X") { g.wins++; $("tttStatus").textContent = "Du gewinnst!"; }
  else if (res.who === "O") { g.losses++; $("tttStatus").textContent = "Der Computer gewinnt."; }
  else { g.draws++; $("tttStatus").textContent = "Unentschieden."; }
  save(); renderTTT(res.line);
}
function play(i) {
  if (board[i] || over) return;
  board[i] = "X";
  let res = winnerOf(board); if (res) return finish(res);
  board[aiMove()] = "O";
  res = winnerOf(board); if (res) return finish(res);
  renderTTT();
}
function newRound() { board = Array(9).fill(null); over = false; $("tttStatus").textContent = "Du bist X und beginnst."; renderTTT(); }
$("tttReset").onclick = newRound;

/* =====================================================
   START
   ===================================================== */
renderProject(); renderTasks(); renderCoords(); renderTeam(); renderClicker(); newRound();
</script>
