<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marineford - Team-Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f12;
            --surface: #151a1f;
            --surface-2: #1c232a;
            --line: #27303a;
            --text: #e7eef5;
            --accent: #2bff9a;
            --danger: #ff5d73;
            --radius: 14px;
            --font-ui: "Chakra Petch", sans-serif;
            --font-mono: "JetBrains Mono", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 10px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text);
            border-bottom: 1px solid var(--line);
            padding-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-family: var(--font-ui);
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }

        ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }

        li {
            background: var(--surface-2);
            border: 1px solid var(--line);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
        }

        .delete-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 4px 10px;
            font-size: 0.8rem;
        }

        .delete-btn:hover {
            background: var(--danger);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>Marineford Dashboard</h1>

    <!-- Live Aufgaben -->
    <div class="card">
        <h2>To-Do Liste (Live)</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Neue Aufgabe eintragen...">
            <button onclick="addTask()">Hinzufügen</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <!-- Live Koordinaten -->
    <div class="card">
        <h2>Wichtige Koordinaten (Live)</h2>
        <div class="input-group">
            <input type="text" id="coordName" placeholder="Ort (z.B. Base, Farm)...">
            <input type="text" id="coordPos" placeholder="X / Y / Z">
            <button onclick="addCoord()">Speichern</button>
        </div>
        <ul id="coordList"></ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Deine Firebase Konfiguration
    const firebaseConfig = {
      apiKey: "AIzaSyDuLNHdFi8DUDGC07qgFvaBKQJv-GDn878",
      authDomain: "minecraft-projekt-99f83.firebaseapp.com",
      projectId: "minecraft-projekt-99f83",
      storageBucket: "minecraft-projekt-99f83.firebasestorage.app",
      messagingSenderId: "71176156343",
      appId: "1:71176156343:web:c205fd60b2e76beca38932",
      measurementId: "G-JY15VP2Q67"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tasksRef = ref(db, 'tasks');
    const coordsRef = ref(db, 'coords');

    // --- TO-DO FUNKTIONEN ---
    window.addTask = function() {
        const input = document.getElementById('taskInput');
        if (input.value.trim() !== "") {
            push(tasksRef, { text: input.value });
            input.value = "";
        }
    };

    onValue(tasksRef, (snapshot) => {
        const list = document.getElementById('taskList');
        list.innerHTML = "";
        const data = snapshot.val();
        for (let id in data) {
            const li = document.createElement('li');
            li.innerHTML = `<span>${data[id].text}</span> 
                            <button class="delete-btn" onclick="deleteTask('${id}')">X</button>`;
            list.appendChild(li);
        }
    });

    window.deleteTask = function(id) {
        remove(ref(db, 'tasks/' + id));
    };

    // --- KOORDINATEN FUNKTIONEN ---
    window.addCoord = function() {
        const name = document.getElementById('coordName');
        const pos = document.getElementById('coordPos');
        if (name.value.trim() !== "" && pos.value.trim() !== "") {
            push(coordsRef, { name: name.value, pos: pos.value });
            name.value = "";
            pos.value = "";
        }
    };

    onValue(coordsRef, (snapshot) => {
        const list = document.getElementById('coordList');
        list.innerHTML = "";
        const data = snapshot.val();
        for (let id in data) {
            const li = document.createElement('li');
            li.innerHTML = `<span><strong>${data[id].name}:</strong> ${data[id].pos}</span> 
                            <button class="delete-btn" onclick="deleteCoord('${id}')">X</button>`;
            list.appendChild(li);
        }
    });

    window.deleteCoord = function(id) {
        remove(ref(db, 'coords/' + id));
    };
</script>

</body>
</html>
